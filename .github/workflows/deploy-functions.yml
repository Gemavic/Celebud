# Auto-deploys Supabase Edge Functions when their source changes on main.
#
# Live function names differ from repo folder names in one case:
#   repo: supabase/functions/generate-article-draft  ->  live: "quick-task"
# (the site calls .../functions/v1/quick-task, so the live name must not change).
#
# JWT posture is preserved per function:
#   fetch-news checks auth INSIDE the function (admin session or cron
#   secret), not at the platform level, so it deploys with --no-verify-jwt
#   and rejects anything that doesn't pass its own check.
#   quick-task requires a signed-in admin session -> default JWT verification
#
# Requires one repository secret: SUPABASE_ACCESS_TOKEN
# (Supabase Dashboard -> Account -> Access Tokens -> Generate new token,
#  then GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret)

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bwtrtzvlqvykobmlfjcl
    steps:
      - name: Check secret is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it in GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy fetch-news (public endpoint, JWT off)
        run: supabase functions deploy fetch-news --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Stage generate-article-draft under its live name (quick-task)
        run: |
          mkdir -p supabase/functions/quick-task
          cp -r supabase/functions/generate-article-draft/. supabase/functions/quick-task/

      - name: Deploy quick-task (AI drafting, JWT on)
        run: supabase functions deploy quick-task --project-ref "$PROJECT_REF"

      - name: Deploy generate-thumbnail (AI thumbnails, JWT on)
        run: supabase functions deploy generate-thumbnail --project-ref "$PROJECT_REF"

      - name: Deploy match-thumbnail (real-photo matching, JWT on)
        run: supabase functions deploy match-thumbnail --project-ref "$PROJECT_REF"

      - name: Deploy generate-creator-audio (AI audio, JWT on)
        run: supabase functions deploy generate-creator-audio --project-ref "$PROJECT_REF"

      - name: Deploy generate-creator-video (AI video via Veo, JWT on)
        run: supabase functions deploy generate-creator-video --project-ref "$PROJECT_REF"

      - name: Deploy generate-author-bio (AI author bios, JWT on)
        run: supabase functions deploy generate-author-bio --project-ref "$PROJECT_REF"

      - name: Deploy enrich-articles (AI article rewriting + SEO, JWT on)
        run: supabase functions deploy enrich-articles --project-ref "$PROJECT_REF"

      - name: Deploy repair-thumbnails (re-host hotlinked images, JWT on)
        run: supabase functions deploy repair-thumbnails --project-ref "$PROJECT_REF"

      - name: Deploy send-newsletter (email editions, JWT on)
        run: supabase functions deploy send-newsletter --project-ref "$PROJECT_REF"

      # These two read articles for the public site. They were missing from
      # this workflow, so edits to them never reached production — the live
      # homepage kept serving unpublished articles that the article page then
      # refused to open ("Article Not Found"). Called from the browser with
      # the anon key as the bearer token, so default JWT verification passes.
      - name: Deploy homepage-data (public homepage feed, JWT on)
        run: supabase functions deploy homepage-data --project-ref "$PROJECT_REF"

      - name: Deploy cached-articles (cached article list, JWT on)
        run: supabase functions deploy cached-articles --project-ref "$PROJECT_REF"

      # The SEO functions are deployed under BOTH capitalisations, on
      # purpose.
      #
      # History: these were originally created live as "Prerender" and
      # "Generate-sitemap" while the repo folders are lowercase. That split
      # meant whoever edited vercel.json had to remember which casing was
      # live, and getting it wrong silently served crawlers the empty SPA
      # shell with no error anywhere — invisible in a browser, because a
      # browser runs the JavaScript. That single ambiguity cost months of
      # AdSense rejections.
      #
      # Deploying both names from the same source removes the trap for good:
      # whichever casing vercel.json points at resolves, and both are always
      # current because they are published from the same folder in the same
      # run. The cost is two extra deploy steps. Do not "tidy" this away.
      - name: Stage prerender + generate-sitemap under both casings
        run: |
          mkdir -p supabase/functions/Prerender supabase/functions/Generate-sitemap
          cp -r supabase/functions/prerender/. supabase/functions/Prerender/
          cp -r supabase/functions/generate-sitemap/. supabase/functions/Generate-sitemap/

      - name: Deploy Prerender (capitalised, legacy live name)
        run: supabase functions deploy Prerender --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy prerender (lowercase, matches repo folder)
        run: supabase functions deploy prerender --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy Generate-sitemap (capitalised, legacy live name)
        run: supabase functions deploy Generate-sitemap --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy generate-sitemap (lowercase, matches repo folder)
        run: supabase functions deploy generate-sitemap --project-ref "$PROJECT_REF" --no-verify-jwt
