# Runs fetch-news once a day — the only controlled trigger for importing
# articles, now that fetch-news requires authentication.
#
# WHY THIS EXISTS
#   Until now, NOTHING scheduled fetch-news at all. The only thing ever
#   triggering it was a "Live" button shown to every anonymous visitor on the
#   homepage, plus an unattended 6-hour auto-repeat per open browser tab. With
#   real traffic — or even one long-lived tab — that fired far more often
#   than once a day, which is the actual explanation for import volume
#   landing at roughly 150-200/day despite fetch-news's own per-run target of
#   30. Nothing capped how many times a run could START; only how many
#   articles one run would import once it did.
#
#   fetch-news is now admin/cron-only (public requests get 401), and this is
#   the one authorized daily trigger, replacing the removed public path.
#
# REQUIRED SECRETS (both must hold the SAME value)
#   1. Supabase -> Edge Functions -> Secrets -> FETCH_NEWS_CRON_SECRET
#   2. GitHub   -> Settings -> Secrets and variables -> Actions -> FETCH_NEWS_CRON_SECRET
#   Without them this workflow skips itself rather than failing loudly.

name: Fetch news daily

on:
  schedule:
    # 11:00 UTC once a day. fetch-news targets 30 quality-gated articles per
    # run, so one run a day delivers exactly the intended daily volume.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FUNCTION_URL: https://bwtrtzvlqvykobmlfjcl.supabase.co/functions/v1/fetch-news
      CRON_SECRET: ${{ secrets.FETCH_NEWS_CRON_SECRET }}
    steps:
      - name: Skip if the cron secret is not configured
        id: guard
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "FETCH_NEWS_CRON_SECRET is not set — skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "Add it to BOTH Supabase Edge Function secrets and GitHub Actions secrets to enable the daily import." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import today's articles
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST "$FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -d '{}' \
            --max-time 170) || { echo "Request failed." >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          added=$(echo "$response" | grep -o '"totalAdded":[0-9]*' | head -1 | cut -d: -f2 || echo 0)
          fetched=$(echo "$response" | grep -o '"totalFetched":[0-9]*' | head -1 | cut -d: -f2 || echo 0)
          skipped=$(echo "$response" | grep -o '"skippedLowQuality":[0-9]*' | head -1 | cut -d: -f2 || echo 0)

          echo "### Fetch news — $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imported: ${added:-0}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scanned: ${fetched:-0}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rejected by quality gate: ${skipped:-0}" >> "$GITHUB_STEP_SUMMARY"
